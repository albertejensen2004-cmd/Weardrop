<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Closet AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==================================================
         SIDEBAR
    ================================================== -->

    <aside class="sidebar">

        <div
            class="logo"
            id="logo"
        >
            <span>✦</span>
            The Wardrobe
        </div>


        <nav>

            <button
                class="nav-item active"
                id="wardrobeNav"
                type="button"
            >
                <span>⌂</span>
                Wardrobe
            </button>


            <button
                class="nav-item"
                id="outfitsNav"
                type="button"
            >
                <span>✧</span>
                Outfits
            </button>


            <button
                class="nav-item"
                id="favoritesNav"
                type="button"
            >
                <span>♡</span>
                Favorites
            </button>

        </nav>


        <div class="sidebar-bottom">

            <button
                class="nav-item"
                id="settingsNav"
                type="button"
            >
                <span>⚙</span>
                Settings
            </button>

        </div>

    </aside>



    <!-- ==================================================
         MAIN
    ================================================== -->

    <main class="main">


        <!-- TOP BAR -->

        <header class="topbar">

            <div>

                <p class="small-title">
                    YOUR DIGITAL WARDROBE
                </p>

                <h1>
                    Welcome back! 💖
                </h1>

            </div>


            <button
                class="profile"
                id="profileButton"
                type="button"
            >
                AJ
            </button>

        </header>



        <!-- ==================================================
             WARDROBE PAGE
        ================================================== -->

        <section id="wardrobePage">


            <!-- HERO -->

            <section class="hero">

                <div>

                    <p class="hero-label">
                        YOUR PERSONAL STYLIST
                    </p>

                    <h2>
                        What are you
                        <br>
                        wearing today?
                    </h2>

                    <p class="hero-text">
                        Build your own outfit from the
                        clothes you already own.
                    </p>

                    <button
                        class="style-button"
                        id="styleOutfitButton"
                        type="button"
                    >
                        Create an outfit!
                    </button>

                </div>


                <div class="hero-decoration">
                    ✦
                </div>

            </section>



            <!-- WARDROBE HEADER -->

            <section class="wardrobe-header">

                <div>

                    <h2>
                        My wardrobe
                    </h2>

                    <p id="itemCount">
                        0 items in your closet
                    </p>

                </div>


                <button
                    class="add-button"
                    id="addItemButton"
                    type="button"
                >
                    + Add item
                </button>

            </section>



            <!-- FILTERS -->

            <div class="filters">

                <button
                    class="filter active"
                    data-category="all"
                    type="button"
                >
                    All
                </button>


                <button
                    class="filter"
                    data-category="top"
                    type="button"
                >
                    Tops
                </button>


                <button
                    class="filter"
                    data-category="bottom"
                    type="button"
                >
                    Bottoms
                </button>


                <button
                    class="filter"
                    data-category="dress"
                    type="button"
                >
                    Dresses
                </button>


                <button
                    class="filter"
                    data-category="shoes"
                    type="button"
                >
                    Shoes
                </button>


                <button
                    class="filter"
                    data-category="accessory"
                    type="button"
                >
                    Accessories
                </button>

            </div>



            <!-- CLOTHING GRID -->

            <section
                class="clothing-grid"
                id="clothingGrid"
            >
            </section>


        </section>



        <!-- ==================================================
             DYNAMIC PAGE
        ================================================== -->

        <section
            id="dynamicPage"
            class="dynamic-page hidden"
        >
        </section>


    </main>



    <!-- ==================================================
         ADD ITEM MODAL
    ================================================== -->

    <div
        class="modal"
        id="addItemModal"
    >

        <div class="modal-content">


            <button
                class="close-modal"
                id="closeModal"
                type="button"
            >
                ×
            </button>


            <h2>
                Add clothing
            </h2>


            <p class="modal-subtitle">
                Add something to your digital wardrobe.
            </p>



            <!-- PHOTO -->

            <label
                class="upload-box"
                for="clothingImage"
            >

                <div id="uploadPlaceholder">

                    <span>
                        📷
                    </span>

                    <strong>
                        Upload a photo
                    </strong>

                    <small>
                        Choose from your photos
                        or take a picture
                    </small>

                </div>


                <img
                    id="imagePreview"
                    class="image-preview"
                    alt="Clothing preview"
                >


                <input
                    type="file"
                    id="clothingImage"
                    accept="image/*"
                    capture="environment"
                >

            </label>


            <!-- CATEGORY -->
            <label class="input-label">
                    Category

                <select id="clothingCategory">
                    <option value="top">
                        Tops
                    </option>

                    <option value="bottom">
                        Bottoms
                    </option>

                    <option value="dress">
                        Dresses
                    </option>

                    <option value="shoes">
                        Shoes
                    </option>

                    <option value="accessory">
                        Accessories
                    </option>

                </select>

            </label>


            <label class="input-label">
                Colour
                <select id="clothingColor">
                    <option value="">
                        Choose colour
                    </option>

                    <option value="black">
                        Black
                    </option>

                    <option value="white">
                        White
                    </option>

                    <option value="beige">
                        Beige
                    </option>

                   <option value="grey">
                        Grey
                    </option>

                    <option value="brown">
                        Brown
                    </option>

                    <option value="blue">
                        Blue
                    </option>

                    <option value="red">
                        Red
                    </option>

                    <option value="pink">
                        Pink
                    </option>

                    <option value="green">
                        Green
                    </option>

                    <option value="yellow">
                        Yellow
                    </option>

                    <option value="orange">
                        Orange
                    </option>

                    <option value="purple">
                        Purple
                    </option>

                    <option value="gold">
                        Gold
                    </option>

                    <option value="silver">
                        Silver
                    </option>

                    <option value="multicolour">
                        Multicolour
                    </option>

                </select>

            </label>

            <label>
                <select id="clothingFabric">

                    <option value="">
                        Choose fabric
                    </option>

                    <option value="denim">
                        Denim
                    </option>

                    <option value="cotton">
                        Cotton
                    </option>

                    <option value="wool">
                        Wool
                    </option>

                    <option value="knit">
                        Knit
                    </option>

                    <option value="satin">
                        Satin
                    </option>

                    <option value="leather">
                        Leather
                    </option>

                    <option value="other">
                        Other
                    </option>
                </select>
            </label>




            <!-- TYPES -->

            <div class="input-label">

                Clothing type

                <p class="field-help">
                    Choose as many as apply.
                </p>


                <div
                    class="tag-picker"
                    id="typePicker"
                >

                    <button
                        type="button"
                        class="type-option"
                        data-type="basic"
                    >
                        Basic
                    </button>

                    <button
                        type="button"
                        class="type-option"
                        data-type="everyday"
                    >
                        Everyday
                    </button>

                    <button
                        type="button"
                        class="type-option"
                        data-type="fine"
                    >
                        Fine
                    </button>

                    <button
                        type="button"
                        class="type-option"
                        data-type="summer"
                    >
                        Summer
                    </button>

                    <button
                        type="button"
                        class="type-option"
                        data-type="winter"
                    >
                        Winter
                    </button>

                    <button
                        type="button"
                        class="type-option"
                        data-type="beach"
                    >
                        Beach
                    </button>


                    <button
                        type="button"
                        class="type-option"
                        data-type="going-out"
                    >
                        Going out
                    </button>

                    <button
                        type="button"
                        class="type-option"
                        data-type="work"
                    >
                        Work
                    </button>

                    <button
                        type="button"
                        class="type-option"
                        data-type="cozy"
                    >
                        Cozy
                    </button>

                    <button
                        type="button"
                        class="type-option"
                        data-type="sport"
                    >
                        Sport
                    </button>

                    <button
                        type="button"
                        class="type-option"
                        data-type="statement"
                    >
                        Statement
                    </button>

                </div>

            </div>



            <!-- SAVE -->

            <button
                class="save-item"
                id="saveItem"
                type="button"
            >
                Add to wardrobe
            </button>


        </div>

    </div>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script src="script.js"></script>

</body>

</html>
